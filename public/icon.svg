<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sonko App Icon">
  <defs>
    <radialGradient id="murramBg" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#8A3B1E" />
      <stop offset="55%" stop-color="#4A1D0F" />
      <stop offset="100%" stop-color="#1F100B" />
    </radialGradient>
    <linearGradient id="amberRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="riverStone" x1="25%" y1="20%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#E7E0D8" />
      <stop offset="65%" stop-color="#B8AEA3" />
      <stop offset="100%" stop-color="#78716C" />
    </linearGradient>
  </defs>

  <!-- Murram Courtyard Surface -->
  <rect width="512" height="512" rx="96" fill="url(#murramBg)" />

  <!-- Subtle outer warm border -->
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="#F59E0B" stroke-opacity="0.22" stroke-width="4" />

  <!-- Top Pair Chalk Squares (4 & 5 / Ewaaka court motif) -->
  <rect x="96" y="88" width="152" height="128" rx="14" fill="#FAF3E8" fill-opacity="0.06" stroke="#FAF3E8" stroke-opacity="0.88" stroke-width="14" />
  <rect x="264" y="88" width="152" height="128" rx="14" fill="#F59E0B" fill-opacity="0.16" stroke="url(#amberRim)" stroke-width="14" />

  <!-- Bottom Single Chalk Square -->
  <rect x="172" y="238" width="168" height="154" rx="16" fill="#FAF3E8" fill-opacity="0.08" stroke="#FAF3E8" stroke-opacity="0.92" stroke-width="15" />

  <!-- Carved Flat River Stone inside Square -->
  <ellipse cx="262" cy="322" rx="54" ry="42" fill="#120805" fill-opacity="0.45" />
  <ellipse cx="256" cy="314" rx="52" ry="40" fill="url(#riverStone)" stroke="#1F100B" stroke-width="7" />
  <!-- Amber Cowrie Inlay on Stone -->
  <ellipse cx="256" cy="314" rx="22" ry="15" fill="url(#amberRim)" stroke="#451A03" stroke-width="3.5" />
  <line x1="242" y1="314" x2="270" y2="314" stroke="#451A03" stroke-width="3.5" stroke-linecap="round" />

  <!-- Warm Chalk Underline Accent -->
  <path d="M138 438 Q 256 426 374 438" fill="none" stroke="url(#amberRim)" stroke-width="12" stroke-linecap="round" />
</svg>
